# Run 8 (results.md) — AST (Audio Spectrogram Transformer), AudioSet-pretrained, frozen backbone
# + fresh classifier head. The literal "pretrained transformer" answer to "should we try a
# transformer" — see notes/improv_cnn.md "Should we use a transformer?" section,
# DECISIONS.md "AST input-length mismatch" entry.
# Frozen first, same reasoning as configs/panns.yaml. Smaller batch size than every other config
# here — attention's quadratic sequence-length cost makes this heavier per-parameter than PANNs
# even frozen, at the ~1200-token loop-padded input length.

data:
  dataset: irmas
  sample_rate: 16000        # matches this project's usual rate — AST's mismatch is temporal
                             # length (see src/models/ast_classifier.py), not sample rate/mel bins
  clip_seconds: 3.0

model:
  name: ast
  num_classes: 11
  freeze_backbone: true

train:
  batch_size: 16             # smaller than the usual 64 — see note above
  epochs: 30
  lr: 0.0001                 # lower than the usual 0.001 — untuned starting point for fine-tuning
                              # a pretrained transformer head, standard practice for this class of
                              # model (large pretrained backbone, small new head)
  optimizer: adam
  weight_decay: 0.0
  mixed_precision: true
  early_stopping_patience: 7

logging:
  backend: tensorboard
  log_dir: runs/
  run_name: run8_ast_frozen
