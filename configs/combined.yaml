# Run 4 (results.md) — regularization + SpecAugment combined (Run 2 + Run 3 together).
# See notes/improv_cnn.md.

data:
  dataset: irmas
  sample_rate: 16000
  clip_seconds: 3.0
  n_mels: 128

model:
  name: baseline_cnn
  num_classes: 11
  dropout: 0.2

train:
  batch_size: 64
  epochs: 30
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0001
  mixed_precision: true
  early_stopping_patience: 7

augmentation:
  specaugment: true
  freq_mask_param: 16
  time_mask_param: 30
  num_freq_masks: 1
  num_time_masks: 1

logging:
  backend: tensorboard
  log_dir: runs/
  run_name: run4_combined
