# Phase 2, Run 2 — regularization only (weight decay + conv-block dropout), isolated.
# Mirrors Phase 1's Run 2 (configs/reg.yaml) exactly in hyperparameters and reasoning — same
# BaselineCNN architecture, same log-mel input shape, so no reason to guess different values.
# Built on Run 1b (configs/phase2_baseline_corrected.yaml), Phase 2's corrected baseline, which
# showed the same overfitting shape as Phase 1's Run 1 (train micro-F1 0.95+ vs val ~0.60).
# See notes/improv_cnn.md section 1, DECISIONS.md "Runs 2-4" entry (Phase 1 precedent).

data:
  dataset: irmas_testing
  sample_rate: 16000
  clip_seconds: 3.0
  n_mels: 128

model:
  name: baseline_cnn
  num_classes: 11
  dropout: 0.2

train:
  batch_size: 64
  epochs: 30
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0001
  mixed_precision: true
  early_stopping_patience: 7

augmentation:
  specaugment: false     # isolating regularization only — SpecAugment is Run 3

logging:
  backend: tensorboard
  log_dir: runs/
  run_name: phase2_run2_regularization
