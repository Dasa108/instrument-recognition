# Run 3 (results.md) — SpecAugment only: time/frequency masking on the log-mel input during
# training. Isolates augmentation's effect vs. Run 1's baseline. See notes/improv_cnn.md, section 2.

data:
  dataset: irmas
  sample_rate: 16000
  clip_seconds: 3.0
  n_mels: 128

model:
  name: baseline_cnn
  num_classes: 11
  dropout: 0.0           # isolating SpecAugment only — regularization is Run 2

train:
  batch_size: 64
  epochs: 30
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  mixed_precision: true
  early_stopping_patience: 7   # stop if val acc hasn't improved in 7 epochs

augmentation:
  specaugment: true
  freq_mask_param: 16    # max width of a masked frequency band, out of 128 mel bins
  time_mask_param: 30    # max width of a masked time band, out of 301 frames
  num_freq_masks: 1
  num_time_masks: 1

logging:
  backend: tensorboard
  log_dir: runs/
  run_name: run3_specaugment
